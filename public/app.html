<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>家庭财务管理</title>
<link rel="stylesheet" href="css/style.css?v=20260805b">
</head>
<body>
<div id="app">
  <header>
    <div class="hdr-left"><span id="user-badge"></span></div>
    <div class="hdr-center" id="month-btn"><span id="month-label"></span><span class="arrow">▾</span></div>
    <div class="hdr-right"><button id="logout-btn">退出</button></div>
  </header>
  <div id="month-dd" class="month-dd hidden">
    <div class="year-nav">
      <button id="year-prev">‹</button>
      <span id="year-disp"></span>
      <button id="year-next">›</button>
    </div>
    <div class="month-grid" id="month-grid"></div>
    <button id="today-btn" class="today-btn">📍 回到本月</button>
  </div>
  <main id="content"></main>
  <nav id="tab-bar">
    <button class="tab-btn active" data-tab="dashboard">首页</button>
    <button class="tab-btn" data-tab="trend">趋势</button>
    <button class="tab-btn" data-tab="input">录入</button>
    <button class="tab-btn" data-tab="history">历史</button>
    <button class="tab-btn" data-tab="settings">设置</button>
  </nav>
</div>
<div id="modal" class="modal hidden"><div class="modal-ov"></div><div class="modal-card" id="modal-card"></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/app.js?v=20260805b"></script>
</body>
</html>
