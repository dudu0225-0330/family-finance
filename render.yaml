services:
  - type: web
    name: family-finance
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: APP_PASSWORD
        value: family123
      - key: DATABASE_URL
        fromDatabase:
          name: family-finance-db
          property: connectionString

databases:
  - name: family-finance-db
    plan: free
    databaseName: family_finance
